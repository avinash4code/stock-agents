[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agents"
version = "0.1.0"
description = "LangGraph agent that gathers recent news about an Indian stock"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-deepseek>=0.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
stock-analyst = "stock_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network and Anthropic API; needs an LLM API key in .env (deselect with -m 'not live')",
]
addopts = "-m 'not live'"
